on:
  pull_request:
    branches:
      - main
      - develop
      - beta

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Github Credentials
        run: |
          git config user.name athos-machine
          git config user.email machine@athoscommerce.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Cache Jest transform output
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-${{ hashFiles('package-lock.json', 'tsconfig.json', 'jest.base.config.json') }}
          restore-keys: |
            ${{ runner.os }}-jest-

      # npm ci downloads and extracts the Cypress binary on every uncached run
      - name: Cache Cypress binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Install packages
        run: npm ci

      - name: ESLint
        run: npm run lint

      # jest runs transpile-only, so this is the only type gate for test files
      - name: Typecheck tests
        run: npm run typecheck:tests

      # jest defaults to cores-1, reserving a core for its mostly-idle coordinator. This
      # ran at 100% for a while (an idle core felt wasteful on small runners), but that
      # let typed-linting tests (packages/snap-preact/eslint) exhaust some OS resource
      # (likely file descriptors/inotify watches) under the resulting worker count -
      # @typescript-eslint/parser's cached ts.Program silently lost its tsconfig `paths`
      # partway through a run and never recovered, permanently no-oping those checks for
      # the rest of the process. 50% keeps most of the parallelism win without hitting
      # that ceiling. nproc is logged so the runner size is visible if this needs retuning.
      - name: Core tests
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          echo "runner cores: $(nproc)"
          npm run test:core -- --maxWorkers=50%

      - name: Verify docs sitemap
        run: npm run build:sitemap -- --check

      - name: Build
        run: npm run build:prod

      # Both Cypress suites reuse the single build above. `test:e2e` runs the cheaper
      # component suite first and &&-chains them, so a component failure skips the demo
      # suite and its dev-server boot.
      - name: E2E tests
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run test:e2e

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.SNAPFU_AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SNAPFU_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Copy files to S3
        shell: bash
        run: |
          aws s3 sync --acl public-read packages/snap-preact-demo/snap/dist s3://${{ secrets.SNAPFU_AWS_BUCKET }}/snap/${{ github.head_ref }}
          aws s3 sync --acl public-read packages/snap-preact-demo/public/snap s3://${{ secrets.SNAPFU_AWS_BUCKET }}/snap/${{ github.head_ref }}
          aws s3 sync --acl public-read packages/snap-preact-demo/public/shared s3://${{ secrets.SNAPFU_AWS_BUCKET }}/snap/${{ github.head_ref }}
          aws s3 sync --acl public-read packages/snap-preact-demo/templates/dist s3://${{ secrets.SNAPFU_AWS_BUCKET }}/templates/${{ github.head_ref }}
          aws s3 sync --acl public-read packages/snap-preact-demo/public/templates s3://${{ secrets.SNAPFU_AWS_BUCKET }}/templates/${{ github.head_ref }}
          aws s3 sync --acl public-read packages/snap-preact-demo/public/shared s3://${{ secrets.SNAPFU_AWS_BUCKET }}/templates/${{ github.head_ref }}
          aws s3 sync --acl public-read packages/snap-preact-demo/hybrid/dist s3://${{ secrets.SNAPFU_AWS_BUCKET }}/hybrid/${{ github.head_ref }}
          aws s3 sync --acl public-read packages/snap-preact-demo/public/hybrid s3://${{ secrets.SNAPFU_AWS_BUCKET }}/hybrid/${{ github.head_ref }}
          aws s3 sync --acl public-read packages/snap-preact-demo/public/shared s3://${{ secrets.SNAPFU_AWS_BUCKET }}/hybrid/${{ github.head_ref }}

      - name: Invalidate CDN files
        shell: bash
        env:
          AWS_MAX_ATTEMPTS: 9
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.SNAPFU_AWS_DISTRIBUTION_ID }} --paths "/snap/${{ github.head_ref }}/*"
          aws cloudfront create-invalidation --distribution-id ${{ secrets.SNAPFU_AWS_DISTRIBUTION_ID }} --paths "/templates/${{ github.head_ref }}/*"
          aws cloudfront create-invalidation --distribution-id ${{ secrets.SNAPFU_AWS_DISTRIBUTION_ID }} --paths "/hybrid/${{ github.head_ref }}/*"
