name: Publish

on:
  push:
    branches:
      - 'main'
      - 'beta'
  workflow_dispatch:
    inputs:
      resume:
        description: 'Resume a failed publish (lerna from-package, no version bump)'
        type: boolean
        default: false

permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"
          token: ${{ secrets.MACHINE_PAT }}

      - name: Set Github credentials
        run: |
          git config user.name athos-machine
          git config user.email machine@athoscommerce.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install packages
        run: npm ci

      - name: Build
        run: |
          npm run build:prod

      - name: Publish packages
        id: release
        if: github.event_name == 'push' && github.ref_name == 'main'
        # keep going so the next step can finish a publish that died part-way through
        continue-on-error: true
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes whatever the registry is still missing. Runs when the release
      # step failed, or on a manual dispatch with "resume" checked.
      #
      # npm signs provenance with Sigstore before it uploads each tarball. When
      # Rekor accepts the entry but answers slowly, npm's 5s timeout resubmits
      # the same signed entry and gets a 409 "equivalent entry already exists"
      # (TLOG_CREATE_ENTRY_ERROR), which aborts that package. Nothing was
      # uploaded, so retrying is safe - `from-package` only publishes versions
      # the registry doesn't have, and every attempt gets further.
      - name: Publish unpublished packages (from-package)
        if: github.ref_name == 'main' && (steps.release.outcome == 'failure' || (github.event_name == 'workflow_dispatch' && github.event.inputs.resume == 'true'))
        run: |
          # `lerna publish` versions, commits and tags before it publishes. If HEAD
          # never moved it failed before any of that - there is nothing to resume,
          # so surface the failure instead of a green job.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "::error::lerna publish failed before versioning - nothing to resume"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            npx lerna publish from-package --yes && exit 0
            echo "::warning::lerna publish from-package failed (attempt $attempt of 5), retrying in 10s"
            sleep 10
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Beta packages
        if: github.event_name == 'push' && github.ref_name == 'beta'
        run: npm run release:beta

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.SNAPFU_AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SNAPFU_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # - name: Generate Metrics Files
      #   run: npm run build:metrics

      # - name: Upload Metrics Files to S3
      #   run: aws s3 sync --region us-east-1 ./metrics/data s3://datawarehouse-stage/team-metrics-import/
