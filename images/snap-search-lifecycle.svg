<svg viewBox="0 0 680 296" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Snap search lifecycle</title>
<desc>A six-step loop: config defines controllers, the controller runs search, the Athos API returns data, it lands in the store, the Preact component renders it, and user interaction updates state to trigger the loop again.</desc>

<rect x="0" y="0" width="680" height="296" fill="#FFFFFF"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Row 1: config / controller / api  -->
<g>
<rect x="50" y="60" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="140" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Config</text>
<text x="140" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">controller list</text>
</g>

<g>
<rect x="250" y="60" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Controller</text>
<text x="340" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">runs search()</text>
</g>

<g>
<rect x="450" y="60" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="540" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Athos API</text>
<text x="540" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">returns data</text>
</g>

<line x1="230" y1="88" x2="248" y2="88" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow-blue)"/>
<line x1="430" y1="88" x2="448" y2="88" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow-blue)"/>
<line x1="540" y1="116" x2="540" y2="198" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow-blue)"/>

<!-- Row 2: store (blue, data) / component / interaction (purple, view) -->
<g>
<rect x="450" y="198" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="540" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Store</text>
<text x="540" y="236" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">controller.store</text>
</g>

<g>
<rect x="250" y="198" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Component</text>
<text x="340" y="236" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">renders from store</text>
</g>

<g>
<rect x="50" y="198" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="140" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Interaction</text>
<text x="140" y="236" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">click → new state</text>
</g>

<line x1="450" y1="226" x2="432" y2="226" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="250" y1="226" x2="232" y2="226" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

<!-- legend -->
<rect x="50" y="276" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="66" y="284" font-family="sans-serif" font-size="11" fill="#5F5E5A">Controller / data</text>
<rect x="220" y="276" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="236" y="284" font-family="sans-serif" font-size="11" fill="#5F5E5A">View / UI</text>
</svg>
